spring.application.name=order-service
spring.kafka.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081

spring.kafka.producer.acks=all
app.kafka.topics.order-created=orders.created.avro

# Inventory Service se aane wale reservation-confirmation event ka Kafka topic
app.kafka.topics.inventory-reserved=inventory.reserved

# Order Service consumer group: ye service inventory.reserved ko read karegi
spring.kafka.consumer.group-id=order-service-group

# Kafka khud offset commit nahi karega; successful DB work ke baad hum manual ACK karenge
spring.kafka.consumer.enable-auto-commit=false

# Naya consumer group ho to purane available messages bhi read kar sakta hai
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka record key String hai, isliye StringDeserializer use hoga
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka JSON value ko Java object mein convert karne ke liye
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Producer service ka Java class/package header ignore karo
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# JSON mapping ke liye Order Service ke allowed event package par trust karo
spring.kafka.consumer.properties.spring.json.trusted.packages=com.aryan.kafka.orderservice.event

# inventory.reserved JSON ko is exact Order Service class mein map karo
spring.kafka.consumer.properties.spring.json.value.default.type=com.aryan.kafka.orderservice.event.InventoryReservedEvent

# Listener ka manual acknowledgment immediately Kafka ko commit karega
spring.kafka.listener.ack-mode=manual_immediate

# Order Service ka MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.username=root
spring.datasource.password=saifee162007

# Existing orders table ko entity mapping ke according update/check karne ke liye
spring.jpa.hibernate.ddl-auto=update

# Console mein Hibernate SQL dekhne ke liye
spring.jpa.show-sql=true
# Inventory se stock reservation fail hone ka result receive karne wala topic
app.kafka.topics.inventory-reservation-failed=inventory.reservation.failed
management.endpoints.web.exposure.include=health,prometheus