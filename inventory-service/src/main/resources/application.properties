spring.application.name=inventory-service
server.port=8082

spring.kafka.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096

spring.kafka.consumer.group-id=inventory-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true
app.kafka.topics.order-created=orders.created.avro
app.kafka.topics.inventory-reserved=inventory.reserved
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.aryan.kafka.inventoryservice.serializer.InventoryValueSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081
#MySQL Databases
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db
spring.datasource.username=root
spring.datasource.password=saifee162007
#Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Stock insufficient hone par Order Service ko bhejne wala rejection event topic
app.kafka.topics.inventory-reservation-failed=inventory.reservation.failed
 #DLT replay ka ON/OFF switch
app.dlt.relay.enabled=false
logging.file.name=logs/inventory-service.log
management.endpoints.web.exposure.include=health,prometheus